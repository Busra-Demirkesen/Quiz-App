<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://kit.fontawesome.com/b40438d37d.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <!--Quiz Configuration Container-->
    <div class="config-container">
      <h2 class="config-title">Quiz Configuration</h2>

      <div class="config-option">
        <h4 class="option-title">Select Category</h4>
        <div class="category-options">
          <button class="category-option active">Programming</button>
          <button class="category-option">Geography</button>
          <button class="category-option">Mathematics</button>
          <button class="category-option">Entertainment</button>
        </div>
      </div>

      <div class="config-option">
        <h4 class="option-title">No. of Questions</h4>
        <div class="question-options">
          <button class="question-option">5</button>
          <button class="question-option active">10</button>
          <button class="question-option">15</button>
          <button class="question-option">20</button>
          <button class="question-option">25</button>
        </div>
      </div>

      <button class="start-quiz-btn">Start Quiz</button>
    </div>

    <!--Quiz Container-->
    <div class="quiz-container">
        <div class="quiz-header">
            <h2 class="quiz-title">Quiz Application</h2>
            <div class="quiz-timer">
                <i class="fa-solid fa-clock"></i>
                <p class="time-duration">15s</p>
            </div>
        </div>

        <div class="quiz-content">
            <h1 class="question-text"><!-- In JavaScript, how do you create a function? --></h1>
            <ul class="answer-options">
              <!--<li class="answer-option">
                    <p>Create function myFunction()</p>
                </li>
                <li class="answer-option correct">
                    <p>Create function myFunction()</p><i class="fa-regular fa-circle-check"></i>
                </li>
                <li class="answer-option incorrect">
                    <p>Create function myFunction()</p><i class="fa-regular fa-circle-xmark"></i>
                </li>
                <li class="answer-option">
                    <p>Create function myFunction()</p>
                </li>-->
                
            </ul>

        </div>

        <div class="quiz-footer">
            <p class="question-status"><b>2</b>of<b>10</b>Questions</p>
            <button class="next-question-btn">Next<i class="fa-solid fa-right-long"></i></button>
        </div>
    </div>

    <!--Result Container-->

    <div class="result-container">
      <img src="quiz-over.png" alt="" class="result-img">
      <h2 class="result-title">Quiz Completed!</h2>
      <p class="result-message">You answered <b>0</b> but of <b>5</b> questions correctly. Great effort!</p>
      <button class="try-again-btn">Try Again</button>
    </div>


    <script src="JavaScript/question.js"></script>
    <script src="JavaScript/script.js"></script>
    
  </body>
</html>
